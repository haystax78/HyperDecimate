schema_version = "1.0.0"

id = "hyper_decimate"
version = "0.1.0"
name = "Hyper Decimate"
tagline = "GPU quadric decimation for multi-million triangle sculpts"
maintainer = "MattGPT"
type = "add-on"

license = ["SPDX:GPL-3.0-or-later"]
blender_version_min = "5.2.0"

tags = ["Mesh", "Modeling"]

# No wheels. The pipeline uses Blender's own gpu module and the bundled numpy,
# so there is nothing to compile per platform and the extension works wherever
# Blender with GPU compute does.

[permissions]
# None. No network, no filesystem access, no clipboard.

[build]
paths_exclude_pattern = [
  "__pycache__/",
  "/.git/",
  "/tests/",
  "/tools/",
  "*.blend",
  "PLAN.md",
]
